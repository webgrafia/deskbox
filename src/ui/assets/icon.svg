<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background App Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>

  <!-- Subtle glow aura behind the cat -->
  <circle cx="64" cy="56" r="34" fill="#818cf8" opacity="0.25"/>

  <!-- Left Cat Ear -->
  <path d="M40 44 L48 18 L62 36 Z" fill="url(#catGrad)"/>
  <path d="M44 40 L49 24 L58 35 Z" fill="#fda4af"/>

  <!-- Right Cat Ear -->
  <path d="M88 44 L80 18 L66 36 Z" fill="url(#catGrad)"/>
  <path d="M84 40 L79 24 L70 35 Z" fill="#fda4af"/>

  <!-- Cat Head -->
  <circle cx="64" cy="52" r="26" fill="url(#catGrad)"/>

  <!-- Cat Body -->
  <path d="M42 74 C42 66, 86 66, 86 74 L90 114 L38 114 Z" fill="url(#catGrad)"/>

  <!-- Smart Glasses -->
  <!-- Left lens -->
  <rect x="46" y="45" width="14" height="11" rx="3.5" fill="#1e1b4b" stroke="#0f172a" stroke-width="2"/>
  <rect x="48" y="47" width="4" height="3" rx="1" fill="#67e8f9" opacity="0.8"/>
  <!-- Right lens -->
  <rect x="68" y="45" width="14" height="11" rx="3.5" fill="#1e1b4b" stroke="#0f172a" stroke-width="2"/>
  <rect x="70" y="47" width="4" height="3" rx="1" fill="#67e8f9" opacity="0.8"/>
  <!-- Glasses bridge -->
  <line x1="60" y1="49" x2="68" y2="49" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Glasses temples -->
  <line x1="46" y1="48" x2="40" y2="46" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="48" x2="88" y2="46" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Cute Nose -->
  <polygon points="62,60 66,60 64,63" fill="#f43f5e"/>

  <!-- Mouth -->
  <path d="M64 63 Q 61 67 58 65" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M64 63 Q 67 67 70 65" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="36" y1="58" x2="46" y2="59" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="63" x2="47" y2="62" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="58" x2="82" y2="59" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="63" x2="81" y2="62" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Laptop Back Screen (angled up towards cat) -->
  <path d="M42 82 L86 82 L80 99 L48 99 Z" fill="#334155"/>
  <path d="M45 84 L83 84 L78 97 L50 97 Z" fill="url(#screenGlow)"/>

  <!-- Laptop Keyboard Base (open in front) -->
  <path d="M30 102 L98 102 L92 114 L36 114 Z" fill="#0f172a"/>
  <!-- Keyboard keys glow row -->
  <line x1="42" y1="105" x2="86" y2="105" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="109" x2="88" y2="109" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Working Paws (typing on the keyboard) -->
  <circle cx="48" cy="103" r="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="80" cy="103" r="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Paw pads details -->
  <circle cx="47" cy="102" r="1.5" fill="#fda4af"/>
  <circle cx="79" cy="102" r="1.5" fill="#fda4af"/>

  <!-- Mini Coffee Mug on the side -->
  <rect x="101" y="99" width="11" height="13" rx="3" fill="#f59e0b"/>
  <!-- Mug handle -->
  <path d="M112 102 Q 116 105 112 108" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Coffee steam -->
  <path d="M104 95 Q 106 91 104 88" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M108 96 Q 110 93 108 90" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
</svg>
